services:

  postgres:
    image: postgres:17-alpine
    container_name: dfsha-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfsha}
      POSTGRES_USER: ${POSTGRES_USER:-dfsha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-dfsha} -d ${POSTGRES_DB:-dfsha}
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - dfsha_network

  storage-1:
    image: python:3.14-slim
    container_name: dfsha-storage-1
    restart: unless-stopped
    command: ["python", "-c", "import time; time.sleep(float('inf'))"]

    volumes:
      - storage_1_data:/data

    expose:
      - "50061"

    networks:
      - dfsha_network

  storage-2:
    image: python:3.14-slim
    container_name: dfsha-storage-2
    restart: unless-stopped
    command: ["python", "-c", "import time; time.sleep(float('inf'))"]

    volumes:
      - storage_2_data:/data

    expose:
      - "50062"

    networks:
      - dfsha_network

  storage-3:
    image: python:3.14-slim
    container_name: dfsha-storage-3
    restart: unless-stopped
    command: ["python", "-c", "import time; time.sleep(float('inf'))"]

    volumes:
      - storage_3_data:/data

    expose:
      - "50063"

    networks:
      - dfsha_network


volumes:
  postgres_data:
  storage_1_data:
  storage_2_data:
  storage_3_data:


networks:
  dfsha_network:
    driver: bridge
