services:

  postgres:
    image: postgres:17-alpine
    container_name: dfsha-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfsha}
      POSTGRES_USER: ${POSTGRES_USER:-dfsha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-dfsha} -d ${POSTGRES_DB:-dfsha}
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - dfsha_network

  metadata:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfsha-metadata
    restart: unless-stopped

    command: ["python", "-m", "src.metadata.server"]

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dfsha}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dfsha}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "50051:50051"

    networks:
      - dfsha_network

  data:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfsha-data
    restart: unless-stopped

    command: ["python", "-m", "src.data.server"]

    depends_on:
      - metadata
      - storage-1
      - storage-2
      - storage-3

    ports:
      - "50052:50052"

    networks:
      - dfsha_network

  storage-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfsha-storage-1
    restart: unless-stopped
    environment:
      NODE_ID: storage-1
      GRPC_PORT: 50061
      STORAGE_PATH: /data
    ports:
      - "50061:50061"
    volumes:
      - storage_1_data:/data
    networks:
      - dfsha_network

  storage-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfsha-storage-2
    restart: unless-stopped
    environment:
      NODE_ID: storage-2
      GRPC_PORT: 50061
      STORAGE_PATH: /data
    ports:
      - "50062:50061"
    volumes:
      - storage_2_data:/data
    networks:
      - dfsha_network

  storage-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfsha-storage-3
    restart: unless-stopped
    environment:
      NODE_ID: storage-3
      GRPC_PORT: 50061
      STORAGE_PATH: /data
    ports:
      - "50063:50061"
    volumes:
      - storage_3_data:/data
    networks:
      - dfsha_network


volumes:
  postgres_data:
  storage_1_data:
  storage_2_data:
  storage_3_data:


networks:
  dfsha_network:
    driver: bridge
