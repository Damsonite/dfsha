syntax = "proto3";

package dfsha.data;

service DataService {
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);

  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse);

  rpc RemoveEntry(RemoveEntryRequest) returns (RemoveEntryResponse);

  rpc Repair(RepairRequest) returns (RepairResponse);

  rpc Health(HealthRequest) returns (HealthResponse);
}

message UploadHeader {
  string owner_id = 1;
  string parent_id = 2;
  string filename = 3;
  string lease_id = 4;
}

message UploadChunk {
  bytes data = 1;
}

message UploadFileRequest {
  oneof payload {
    UploadHeader header = 1;
    UploadChunk chunk = 2;
  }
}

message UploadFileResponse {
  bool success = 1;
  string file_id = 2;
  string filename = 3;
  int64 size = 4;
  string checksum = 5;
  int32 block_count = 6;
  string message = 7;
}

message DownloadFileRequest {
  string owner_id = 1;
  string file_id = 2;
}

message DownloadFileResponse {
  int32 block_index = 1;
  bytes data = 2;
}

message RemoveEntryRequest {
  string owner_id = 1;
  string entry_id = 2;
}

message RemoveEntryResponse {
  bool success = 1;
  string message = 2;
}

message RepairRequest {
  int32 target_replicas = 1;
}

message RepairResponse {
  bool success = 1;
  int32 blocks_checked = 2;
  int32 replicas_repaired = 3;
  repeated string failures = 4;
  string message = 5;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}
